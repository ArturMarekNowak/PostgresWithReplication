#cloud-config
# Set root password to "password" (change this!)
chpasswd:
  list: |
    root:password
  expire: false

# Enable SSH password authentication
ssh_pwauth: true

# Install and enable SSH server
packages:
  - openssh-server

# Set timezone
timezone: UTC

# Final message on console
final_message: "VM is ready! SSH: ssh root@$IP"
