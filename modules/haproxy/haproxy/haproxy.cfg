frontend postgres_frontend
    bind *:5432
    mode tcp
    default_backend postgres_backend

backend postgres_backend
    mode tcp
    option tcp-check
    option httpchk GET /primary  # patroni provides an endpoint to check node roles
    http-check expect status 200  # expect 200 for the primary node
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    server postgresql-0 10.0.1.30:5432 port 8008 check check-ssl verify none
    server postgresql-1 10.0.1.31:5432 port 8008 check check-ssl verify none
    server postgresql-2 10.0.1.32:5432 port 8008 check check-ssl verify none

